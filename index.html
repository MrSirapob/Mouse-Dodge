<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>Wave Dodge</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07090d}
    body{display:grid;place-items:center;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .boot{opacity:.45;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="boot">INITIALIZING SYSTEM</div>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const testMaintenance = params.get("maintenanceTest") === "1";

      try {
        const response = testMaintenance
          ? null
          : await fetch("./maintenance.json?t=" + Date.now(), {
              cache: "no-store",
              headers: { "Cache-Control": "no-cache" }
            });

        const data = response ? await response.json() : { maintenance: true };

        const target = data.maintenance ? "./maintenance.html" : "./game.html";
        location.replace(target + location.search);
      } catch {
        // If the status file cannot be reached, fail open to the game.
        // This prevents a temporary GitHub/network issue from taking the game offline.
        location.replace("./game.html" + location.search);
      }
    })();
  </script>
</body>
</html>
