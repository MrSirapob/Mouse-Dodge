<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>Wave Dodge — ปิดปรับปรุง</title>
  <style>
    :root {
      --bg: #07090d;
      --text: #f4f5f7;
      --muted: #858b96;
      --line: rgba(255,255,255,.09);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.055), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,.025), transparent 40%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    /* Ambient background */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 42vw;
      height: 42vw;
      min-width: 320px;
      min-height: 320px;
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: breathe 5s ease-in-out infinite;
    }

    .ambient::after {
      width: 62vw;
      height: 62vw;
      min-width: 480px;
      min-height: 480px;
      opacity: .55;
      animation-delay: -2.5s;
    }

    .grid {
      position: absolute;
      inset: -20%;
      opacity: .14;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      transform: perspective(500px) rotateX(62deg) translateY(18%);
      transform-origin: center bottom;
      animation: gridMove 9s linear infinite;
    }

    .dot {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,.45);
      box-shadow: 0 0 14px rgba(255,255,255,.4);
      animation: float 6s ease-in-out infinite;
    }
    .d1 { left: 14%; top: 24%; animation-delay: -.8s; }
    .d2 { left: 78%; top: 22%; animation-delay: -3.2s; }
    .d3 { left: 24%; top: 76%; animation-delay: -4.4s; }
    .d4 { left: 84%; top: 72%; animation-delay: -1.7s; }

    .card {
      position: relative;
      z-index: 2;
      width: min(620px, 100%);
      padding: clamp(36px, 7vw, 64px) clamp(24px, 7vw, 64px);
      text-align: center;
      border: 1px solid var(--line);
      background: rgba(11,13,18,.76);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 30px 100px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.035);
      animation: cardIn .8s cubic-bezier(.22,1,.36,1) both;
    }

    .topline {
      width: 54px;
      height: 2px;
      margin: 0 auto 30px;
      background: rgba(255,255,255,.7);
      transform-origin: center;
      animation: lineIn .9s .2s cubic-bezier(.22,1,.36,1) both;
    }

    .gear-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      animation: iconIn .9s .15s cubic-bezier(.22,1,.36,1) both;
    }

    .gear-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50%;
      animation: ringPulse 3s ease-in-out infinite;
    }

    .gear {
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 0 16px rgba(255,255,255,.13));
      animation: spin 7s linear infinite;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: #8e949e;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      animation: fadeUp .7s .32s both;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 52px);
      line-height: 1.1;
      letter-spacing: -.035em;
      font-weight: 700;
      animation: fadeUp .7s .42s both;
    }

    .desc {
      margin: 18px auto 0;
      max-width: 430px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      animation: fadeUp .7s .52s both;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.09);
      color: #9298a2;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .18em;
      animation: fadeUp .7s .62s both;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #aeb3bb;
      box-shadow: 0 0 0 0 rgba(255,255,255,.3);
      animation: statusPulse 1.8s ease-out infinite;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes iconIn {
      from { opacity: 0; transform: scale(.65) rotate(-25deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes lineIn {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(.96); opacity: .45; }
      50% { transform: translate(-50%, -50%) scale(1.04); opacity: .8; }
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(.9); opacity: .3; }
      50% { transform: scale(1.08); opacity: .8; }
    }

    @keyframes statusPulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,.28); }
      70% { box-shadow: 0 0 0 7px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

    @keyframes gridMove {
      from { background-position: 0 0, 0 0; }
      to { background-position: 0 48px, 48px 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: .3; }
      50% { transform: translateY(-14px); opacity: .8; }
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { padding: 38px 22px; }
      .desc { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="grid"></div>
    <span class="dot d1"></span>
    <span class="dot d2"></span>
    <span class="dot d3"></span>
    <span class="dot d4"></span>
  </div>

  <main class="card">
    <div class="topline"></div>

    <div class="gear-wrap" aria-hidden="true">
      <div class="gear">⚙</div>
    </div>

    <div class="eyebrow">WAVE DODGE</div>
    <h1>กำลังปิดปรับปรุง</h1>
    <p class="desc">
      ขณะนี้เกมกำลังอยู่ระหว่างการปรับปรุง<br>
      เรากำลังเตรียมเวอร์ชันใหม่ให้พร้อมใช้งาน
    </p>

    <div class="status">
      <span class="pulse"></span>
      UNDER MAINTENANCE
    </div>
  </main>
</body>
</html>
